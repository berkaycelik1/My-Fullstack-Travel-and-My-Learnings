<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Saati</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal { display: none; }
        .modal.is-open { display: block; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .modal__container { background: white; padding: 30px; margin: 10% auto; width: 300px; border-radius: 10px; text-align: center;}
    </style>
</head>
<body>

    <h1 id="saat-kutusu">Yükleniyor...</h1>

    <button data-micromodal-trigger="pencere-1">Ülke Seç</button>

    <div class="modal" id="pencere-1" aria-hidden="true">
        <div class="modal__overlay" tabindex="-1" data-micromodal-close>
            <div class="modal__container" role="dialog" aria-modal="true">
                <h2>Saat Dilimi Seç</h2>
                
                <select id="ulke-secimi">
                    <option value="Europe/Istanbul">İstanbul</option>
                    <option value="Asia/Tokyo">Tokyo</option>
                    <option value="America/New_York">New York</option>
                </select>
                
                <br><br>
                <button data-micromodal-close>Kapat</button>
            </div>
        </div>
    </div>

    <script src="./node_modules/dayjs/dayjs.min.js"></script>
    <script src="./node_modules/dayjs/plugin/utc.js"></script>
    <script src="./node_modules/dayjs/plugin/timezone.js"></script>
    <script src="./node_modules/micromodal/dist/micromodal.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
