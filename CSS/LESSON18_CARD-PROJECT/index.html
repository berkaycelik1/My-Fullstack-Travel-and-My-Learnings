<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mini-Project: Profile Card's</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Our Staff</h1>
        <nav>
            <a href="#profile1">Max</a>
            <a href="#profile2">Ricciardo</a>
            <a href="#profile3">Hamilton</a>
        </nav>
    </header>

    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="img/max.png" alt="Max Coder" width="500" height="500">
                <figcaption>Max Coder</figcaption>
            </figure>
            <p><q>I code stuff.</q></p>
        </article>

        <article id="profile2" class="card">
            <figure>
                <img src="img/riccardo.png" alt="Ricciardo Designer" width="500" height="500">
                <figcaption>Ricciardo Designer</figcaption>
            </figure>
            <p><q>I design stuff.</q></p>
        </article>

        <article id="profile3" class="card">
            <figure>
                <img src="img/hamilton.png" alt="Hamilton Dev Rel" width="500" height="500">
                <figcaption>Hamilton <span class="nowrap">Dev Rel</span></figcaption>
            </figure>
            <p><q>I teach stuff.</q></p>
        </article>
    </main>
    <footer>
       <p>&copy; Acme Co.</p>
    </footer>
</body>
</html>
